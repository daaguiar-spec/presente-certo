<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9467e">
<meta name="description" content="PresenteCerto: a rede social dos presentes. Saiba os tamanhos, os gostos e o que seus amigos querem ganhar.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.logged-out nav.tabs,.logged-out #meChip{display:none!important}
.login{max-width:420px;margin:0 auto;padding-top:28px;display:flex;flex-direction:column;gap:16px}
.login .g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:600 15px var(--body,system-ui);padding:12px;border-radius:999px;border:1px solid var(--line,#ddd);background:#fff;color:#2e2536;cursor:pointer}
.login .sep{display:flex;align-items:center;gap:10px;color:var(--muted,#888);font-size:13px}
.login .sep::before,.login .sep::after{content:"";flex:1;height:1px;background:var(--line,#ddd)}
.login .err{color:#b42318;font-size:14px;min-height:1em}
.login .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk,#f4f4f4);border-radius:999px;padding:4px}
.login .seg button{border:0;background:none;padding:8px;border-radius:999px;font:600 14px var(--body,system-ui);color:var(--muted,#777);cursor:pointer}
.login .seg button[aria-pressed="true"]{background:#fff;color:var(--fg,#222);box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<title>PresenteCerto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: app de uma coluna, cabeçalho fixo e navegação em abas; fichas de "etiqueta de presente" para perfis */
:root{
  --bg:#fdfbfd; --surface:#ffffff; --sunk:#f7f2f8; --line:#ece4ef;
  --fg:#2e2536; --muted:#7d7186; --accent:#d9467e; --accent-ink:#ffffff; --accent-soft:#fdeef4;
  --ribbon:#2a9d8c; --ribbon-soft:#e8f7f4; --warn:#a8670a; --warn-soft:#fdf5e6; --gold:#8a6d12; --gold-soft:#fbf4dc;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:light;
}
/* Visual claro fixo: não muda para o modo escuro do celular */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{background:none;border:0;padding:0;color:var(--fg);cursor:pointer;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:10px}
.admin-btn{font:700 12px var(--body);letter-spacing:.04em;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
.banner{background:var(--ribbon-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.urow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.urow img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.avatar-btn{border:2px solid var(--accent-soft);background:none;padding:0;border-radius:50%;cursor:pointer;display:flex}
.avatar-btn img{width:34px;height:34px;border-radius:50%;object-fit:cover}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--muted);font:600 11px var(--body);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:28px;font-weight:800;line-height:1.15}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.lede{color:var(--muted);margin:6px 0 0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.view{display:flex;flex-direction:column;gap:18px;padding-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel.hl{background:var(--accent-soft);border-color:transparent}
.panel.ad{background:var(--gold-soft);border-color:transparent}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label.f,.flabel{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;padding:0}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font:600 14px var(--body);border-radius:999px;padding:10px 18px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.small{padding:7px 14px;font-size:13px}
.btn.on{background:var(--ribbon-soft);color:var(--ribbon);border-color:transparent}
.btn.green{background:var(--ribbon);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font:600 13px var(--body);cursor:pointer;text-decoration:none}
.link.alt{color:var(--ribbon)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:500 13px var(--body);color:var(--fg)}
button.chip{cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.avoid[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft)}
.chip.style[aria-pressed="true"]{border-color:var(--ribbon);background:var(--ribbon-soft)}
.chip .dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.grau{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.grau.g1{background:var(--accent);color:var(--accent-ink)}
.grau.g2{background:var(--accent-soft);color:var(--accent)}
.grau.g3{background:var(--sunk);color:var(--muted)}
.wish{display:flex;flex-direction:column;gap:8px}
.wish-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;background:var(--sunk);border-radius:12px;padding:10px 12px}
.wish-item .n{font-family:var(--display);font-weight:800;color:var(--accent);font-size:18px;line-height:1.3}
.need .wish-item .n{color:var(--ribbon)}
.wish-item .t{font-weight:600;overflow-wrap:anywhere}
.wish-item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.wish-item a{color:var(--ribbon);font-weight:600;font-size:13px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;display:block}
.thumb.sm{width:52px;height:52px;margin-top:6px}
.shop{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:2px}
.shop span{color:var(--muted)}
.item-actions{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.status{grid-column:2 / -1;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.status .msg{color:var(--muted)}
.status .msg b{color:var(--fg)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ribbon);border-radius:99px}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;font-size:18px;line-height:1}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.person img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.person .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .meta{font-size:13px;color:var(--muted)}
.tap{cursor:pointer}
.when{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.when.soon{background:var(--warn-soft);color:var(--warn)}
.when.today{background:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:10px}
.holidays{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.holiday{flex:none;background:var(--ribbon-soft);color:var(--ribbon);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
.holiday span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:24px 16px;border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.tag-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tag-head{background:var(--accent-soft);padding:18px 16px;display:flex;gap:14px;align-items:center;position:relative}
.tag-head img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--surface)}
.tag-head .hole{position:absolute;right:18px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tag-body{padding:16px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.size{background:var(--sunk);border-radius:10px;padding:10px;text-align:center}
.size b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.size span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kv{display:grid;grid-template-columns:minmax(90px,130px) 1fr;gap:0 14px;font-size:14px;margin:0}
.kv dt,.kv dd{padding-block:12px;border-top:1px solid var(--line)}
.kv dt:first-of-type,.kv dd:first-of-type{border-top:0;padding-top:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
.back{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:0;align-self:flex-start}
.savebar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;z-index:3}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.inline-form{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.date-row{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:14px}
.pix-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--sunk);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
.qr{background:#fff;padding:8px;border-radius:8px;align-self:flex-start}
.qr img,.qr canvas{display:block;width:180px;height:180px}
.secret{background:var(--accent-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.secret b.big{font-family:var(--display);font-size:22px}
.idea{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.idea .t{font-weight:700}
.thanks{background:var(--ribbon-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.steps-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.steps-nav .chip{flex:none}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.chip:disabled{opacity:.6;cursor:default}
.spons{background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6}
.spons a,.spons .link{color:var(--accent);font-weight:600}
.ofertas{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.oferta{flex:none;width:160px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;color:var(--fg);text-decoration:none;font-size:14px}
.oferta .preco{color:var(--accent);font-weight:700}
.plus-badge{display:inline-block;font:700 11px var(--body);letter-spacing:.04em;background:linear-gradient(135deg,#d9467e,#8a4fd1);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:3px;margin-left:4px}
.tag-head.escura h1,.tag-head.escura .muted,.tag-head.escura .small{color:#fff!important}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:999px;padding:4px}
.seg2 button{border:0;background:none;padding:8px;border-radius:999px;font:600 14px var(--body);color:var(--muted);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat div{background:var(--surface);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.feed{display:flex;flex-direction:column;gap:10px}
.post{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.post img.av{width:40px;height:40px;border-radius:50%;object-fit:cover}
.post .txt{font-size:14px;overflow-wrap:anywhere}
.post .when2{font-size:12px;color:var(--muted);margin-top:2px}
.post.hot{background:var(--accent-soft);border-color:transparent}
.post blockquote{margin:6px 0 0;padding:8px 10px;background:var(--sunk);border-radius:10px;font-size:14px}
.msg-card{display:grid;grid-template-columns:32px 1fr;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.msg-card img{width:32px;height:32px;border-radius:50%;object-fit:cover}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.chip{transition:background .15s,color .15s,border-color .15s}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <button class="logo" id="logoBtn" aria-label="Ir para a página principal"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="12" width="24" height="16" rx="3" fill="var(--accent)"/><rect x="2" y="8" width="28" height="6" rx="2" fill="var(--accent)"/><rect x="14" y="8" width="4" height="20" fill="var(--ribbon)"/><path d="M16 8c-3-5-9-5-8-1 1 2 5 1 8 1zm0 0c3-5 9-5 8-1-1 2-5 1-8 1z" fill="var(--ribbon)"/></svg><span>Presente<span style="color:var(--accent)">Certo</span></span></button>
  <div class="me-chip" id="meChip"></div>
</div></header>

<main class="wrap" id="app">
  <div class="view">
    <h1>Carregando sua conta…</h1>
    <p class="lede">Cada pessoa monta sua ficha de presentes: tamanhos, cores, estilo, o que pretende ganhar e o que está precisando com urgência. Você segue amigos e família e consulta a ficha deles perto das datas especiais.</p>
  </div>
</main>
<input type="file" id="fotoInput" accept="image/*" hidden>

<nav class="tabs" aria-label="Seções"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" data-tab="mural" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Mural</button>
  <button class="tab" role="tab" data-tab="datas" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Datas<span class="badge" id="badge" hidden></span></button>
  <button class="tab" role="tab" data-tab="pessoas" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Encontrar</button>
  <button class="tab" role="tab" data-tab="sorteio" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9C10 4 6 5 7 7s5 2 5 2zm0 0c2-5 6-4 5-2s-5 2-5 2z"/></svg>Amigo secreto</button>
  <button class="tab" role="tab" data-tab="perfil" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Minha ficha</button>
</div></nav>

<script>
/* Ponte PresenteCerto ⇄ Firebase: login (Google e e-mail), banco de dados e sugestões por IA */
(function(){
  const app=document.getElementById('app');
  const cfg=window.FIREBASE_CONFIG;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(!window.firebase||!cfg||!cfg.apiKey||/COLE/i.test(cfg.apiKey)){
    window.__semConfig=true;window.claude=null;window.__loggedOut=true;document.body.classList.add('logged-out');
    app.innerHTML='<div class="view"><h1>Falta configurar o Firebase</h1><p class="lede">Abra o arquivo <b>firebase-config.js</b> e cole os dados do seu projeto Firebase, como explica o guia LEIA-ME.</p></div>';
    return;
  }
  firebase.initializeApp(cfg);
  const auth=firebase.auth(),fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true})}catch(e){}
  const ADMIN=String(window.ADMIN_EMAIL||'').toLowerCase();
  function initials(name){const ini=String(name||'?').split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
    return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#fdeef4"/><text x="32" y="41" font-family="sans-serif" font-size="24" font-weight="700" fill="#d9467e" text-anchor="middle">${ini.replace(/[<&]/g,'')}</text></svg>`)}
  const nomeDe=u=>u.displayName||(u.email||'').split('@')[0]||'Você';

  let resolveUser;const ready=new Promise(r=>resolveUser=r);
  const usuarios={};let resolveUsuarios;const usuariosOk=new Promise(r=>resolveUsuarios=r);

  /* ---------- tela de login ---------- */
  let modo='entrar',erro='',ocupado=false;
  const MSG={'auth/invalid-email':'Este e-mail não parece válido.','auth/missing-password':'Digite sua senha.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/email-already-in-use':'Já existe uma conta com este e-mail. Toque em Entrar.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'Não encontramos conta com este e-mail. Toque em Criar conta.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos e tente de novo.',
    'auth/network-request-failed':'Sem conexão com a internet.','auth/popup-closed-by-user':'','auth/cancelled-popup-request':'','auth/unauthorized-domain':'Este endereço ainda não foi autorizado no Firebase. Veja o passo 6 do guia LEIA-ME.'};
  const msgDe=e=>(e&&e.code in MSG)?MSG[e.code]:'Não foi possível entrar agora. Tente de novo.';
  function showLogin(){
    document.body.classList.add('logged-out');window.__loggedOut=true;
    app.innerHTML=`<div class="login">
      <div><h1>Entre no PresenteCerto</h1><p class="lede">Monte sua ficha de presentes e descubra o que seus amigos querem ganhar.</p></div>
      <button class="g-btn" id="lgGoogle" ${ocupado?'disabled':''}><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6C12.4 13.4 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.8c-.5-1.4-.8-3-.8-4.8s.3-3.3.8-4.8l-7.8-6C1 16.5 0 20.1 0 24s1 7.5 2.7 10.8l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>Entrar com Google</button>
      <div class="sep">ou com e-mail</div>
      <div class="seg"><button id="lgM1" aria-pressed="${modo==='entrar'}">Entrar</button><button id="lgM2" aria-pressed="${modo==='criar'}">Criar conta</button></div>
      <form id="lgForm" class="panel" novalidate>
        ${modo==='criar'?'<label class="f">Seu nome<input id="lgNome" autocomplete="name" required></label>':''}
        <label class="f">E-mail<input id="lgEmail" type="email" autocomplete="${modo==='criar'?'email':'username'}" inputmode="email" autocapitalize="off" required></label>
        <label class="f">Senha<input id="lgSenha" type="password" autocomplete="${modo==='criar'?'new-password':'current-password'}" minlength="6" required></label>
        <div class="err" role="alert">${esc(erro)}</div>
        <button class="btn" type="submit" ${ocupado?'disabled':''}>${ocupado?'Aguarde…':modo==='criar'?'Criar minha conta':'Entrar'}</button>
        ${modo==='entrar'?'<button class="link" type="button" id="lgReset">Esqueci minha senha</button>':''}
      </form></div>`;
    const v=id=>(document.getElementById(id)?.value||'').trim();
    document.getElementById('lgM1').onclick=()=>{modo='entrar';erro='';showLogin()};
    document.getElementById('lgM2').onclick=()=>{modo='criar';erro='';showLogin()};
    document.getElementById('lgGoogle').onclick=async()=>{
      const prov=new firebase.auth.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
      try{await auth.signInWithPopup(prov)}catch(e){
        if(e&&['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){try{await auth.signInWithRedirect(prov)}catch(e2){erro=msgDe(e2);showLogin()}}
        else{erro=msgDe(e);showLogin()}}
    };
    document.getElementById('lgForm').onsubmit=async ev=>{
      ev.preventDefault();const email=v('lgEmail'),senha=document.getElementById('lgSenha').value;
      if(modo==='criar'&&!v('lgNome')){erro='Digite seu nome.';return showLogin()}
      ocupado=true;erro='';showLogin();
      try{
        if(modo==='criar'){const c=await auth.createUserWithEmailAndPassword(email,senha);await c.user.updateProfile({displayName:v('lgNome')||nomeDe(c.user)});await salvarUsuario(c.user)}
        else await auth.signInWithEmailAndPassword(email,senha);
      }catch(e){ocupado=false;erro=msgDe(e);showLogin()}
    };
    const rs=document.getElementById('lgReset');
    if(rs)rs.onclick=async()=>{const email=v('lgEmail');if(!email){erro='Digite seu e-mail acima e toque de novo em Esqueci minha senha.';return showLogin()}
      try{await auth.sendPasswordResetEmail(email);erro='';app.querySelector('.err').textContent='Enviamos um link para redefinir a senha. Confira seu e-mail.'}catch(e){erro=msgDe(e);showLogin()}};
  }
  async function salvarUsuario(u){try{await fs.doc('usuarios/'+u.uid).set({nome:nomeDe(u),foto:u.photoURL||'',atualizado:new Date().toISOString()},{merge:true})}catch(e){}}

  auth.getRedirectResult().catch(e=>{erro=msgDe(e)});
  let started=false;
  auth.onAuthStateChanged(async u=>{
    if(!u){if(started){location.reload();return}showLogin();return}
    if(started)return;started=true;
    document.body.classList.remove('logged-out');window.__loggedOut=false;
    app.innerHTML='<div class="view"><h1>Carregando sua conta…</h1></div>';
    await salvarUsuario(u);
    fs.collection('usuarios').onSnapshot(s=>{s.docs.forEach(d=>{usuarios[d.id]=d.data()});resolveUsuarios()},()=>resolveUsuarios());
    resolveUser(u);
  });

  const userApi=u=>({
    id:async()=>u.uid,
    me:async()=>({id:u.uid,name:nomeDe(u),avatarUrl:u.photoURL||initials(nomeDe(u)),email:u.email||''}),
    isOwner:async()=>!!ADMIN&&String(u.email||'').toLowerCase()===ADMIN&&!!u.emailVerified,
    profiles:async ids=>{await usuariosOk;const out={};ids.forEach(id=>{const x=usuarios[id];if(x)out[id]={id,name:x.nome||'',avatarUrl:x.foto||initials(x.nome)}});return out},
    logout:()=>auth.signOut()
  });
  const sampleApi=u=>({
    json:async prompt=>{
      const t=await u.getIdToken();
      const r=await fetch('/api/sugestoes',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({prompt})});
      if(r.status===429)throw {code:'rate_limited'};
      if(!r.ok)throw {code:'unavailable'};
      return (await r.json()).resultado;
    }
  });
  window.claude={use:async name=>{const u=await ready;if(name==='db')return fs;if(name==='user')return userApi(u);if(name==='sample')return sampleApi(u);return null}};
})();
</script>
<script>
(function(){
const APP_URL=location.origin;
const app=document.getElementById('app');
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CORES={'Preto':'#111','Branco':'#fff','Cinza':'#9a9a9a','Bege':'#d9c7a7','Marrom':'#7a4b2a','Vermelho':'#c62828','Rosa':'#ec7fb0','Roxo':'#7b3fa0','Azul':'#2f5fc4','Azul-marinho':'#1b2a4e','Verde':'#2e7d4f','Amarelo':'#f2c230','Laranja':'#ef7d22','Dourado':'#c9a23a','Prata':'#c0c4c8'};
const ESTILOS=['Básico','Clássico','Esportivo','Casual','Romântico','Moderno','Alternativo','Elegante','Praiano','Geek'];

// Catálogo para adicionar presentes com toques. [nome, campo de tamanho da ficha]
const CAT_DESEJOS={

  'Joias e acessórios':[['Anel','anel'],'Colar','Brinco','Pulseira','Relógio','Óculos de sol','Bolsa','Carteira','Boné'],

  'Bebê':['Roupinhas de bebê','Brinquedo educativo','Kit de banho do bebê','Mordedor','Livro infantil'],
  'Pet':['Caminha para pet','Brinquedo para pet','Coleira','Petiscos','Comedouro']
};
const CAT_PRECISA={

  'Cozinha':['Jogo de panelas','Jogo de pratos','Jogo de copos','Talheres','Liquidificador','Sanduicheira','Potes herméticos','Panela de pressão'],
  'Cama e banho':[['Jogo de lençóis','cama'],['Edredom','cama'],'Travesseiro','Toalhas de banho','Roupão'],
  'Roupas do dia a dia':[['Meias','calcado'],['Roupa íntima','camiseta'],['Tênis para o dia a dia','calcado'],['Camisetas básicas','camiseta'],['Calça básica','calca']],
  'Escritório e estudo':['Mochila','Mouse sem fio','Fone com microfone','Agenda','Garrafa térmica','Suporte para notebook'],
  'Saúde e cuidado':['Kit de primeiros socorros','Massageador','Balança','Medidor de pressão','Protetor solar'],
  'Bebê':['Fraldas','Lenços umedecidos','Carrinho de bebê','Body de bebê','Mamadeira','Banheira de bebê']
};
const FAIXAS=['até R$ 50','até R$ 100','até R$ 200','até R$ 500','acima de R$ 500'];
const TAG_GOSTOS=['Café','Chá','Vinho','Cerveja','Chocolate','Leitura','Viagem','Praia','Futebol','Academia','Corrida','Yoga','Cozinhar','Séries e filmes','Música','Games','Plantas','Pets','Tecnologia','Moda','Maquiagem','Artesanato','Fotografia','Pescaria'];
const TAG_MARCAS=['Natura','O Boticário','Nike','Adidas','Apple','Samsung','Zara','Renner','Farm','Arezzo','Havaianas','Tramontina','Granado','Vivara','Lacoste','Melissa'];
const TAG_ALERGIAS=['Lactose','Glúten','Amendoim','Frutos do mar','Níquel','Lã','Perfume forte','Pelo de animal'];
const TAM_TXT={camiseta:v=>'tamanho '+v,calca:v=>'nº '+v,calcado:v=>'nº '+v,vestido:v=>'tamanho '+v,anel:v=>'aro '+v,cama:v=>'cama '+v};
const CAT_COR=new Set(['Roupas','Calçados','Joias e acessórios','Roupas do dia a dia']);
let quickSel={},fichaStep=null;
const juntar=(tags,txt)=>[...(tags||[]),...(String(txt||'').trim()?[String(txt).trim()]:[])].join(', ');

const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

let db=null,user=null,sample=null,myId=null,myName='',myEmail='',isOwner=false;
let profiles={},followsAll={},acoes={},names={},agrad={},sorteios={},config={},grupos=[],fotos={},fotoSubs={},aiRes={};
let tab='mural',parabens={},viewing=null,draft=null,dirty=false,query='',form=null,grupoFiltro='',fotoTarget=null,pendingRender=false;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const failMsg='Não foi possível salvar. Confira sua internet e tente de novo.';
function blank(){return{gostosTags:[],marcasTags:[],alergiasTags:[],dia:'',mes:'',ano:'',camiseta:'',calca:'',calcado:'',vestido:'',anel:'',cama:'',cores:[],evitarCores:[],estilos:[],perfume:[],tipoPresente:'',marcas:'',hobbies:'',gosta:'',naoGosta:'',alergias:'',obs:'',desejos:[],precisa:[],recebidos:[],datas:[],fechado:false,aviso:15,atualizado:''}}
const isEx=id=>!!profiles[id]?.exemplo;
const nm=id=>id===myId?'Você':isEx(id)?(profiles[id].nome+' (exemplo)'):(names[id]?.name||'Alguém');
const firstName=id=>id===myId?(myName||'Você'):isEx(id)?profiles[id].nome:(names[id]?.name||'Alguém');
function initialsAvatar(name){const ini=String(name||'?').split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
  return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#fdeef4"/><text x="32" y="41" font-family="sans-serif" font-size="24" font-weight="700" fill="#d9467e" text-anchor="middle">${ini.replace(/[<&]/g,'')}</text></svg>`)}
const av=id=>isEx(id)?initialsAvatar(profiles[id].nome):(names[id]?.avatar||initialsAvatar(nm(id)));
const following=()=>(followsAll[myId]?.ids)||[];
const myAcoes=()=>{const a=acoes[myId]||{};return{reservas:[...(a.reservas||[])],vaquinhas:[...(a.vaquinhas||[])],cotas:[...(a.cotas||[])]}};
function canSee(id){const p=profiles[id];if(!p)return false;return id===myId||!p.fechado||(p.aprovados||[]).includes(myId)}
function pendingRequests(){const me=profiles[myId];if(!me||!me.fechado)return[];const ok=new Set([...(me.aprovados||[]),...(me.recusados||[])]);return Object.keys(followsAll).filter(id=>id!==myId&&(followsAll[id].ids||[]).includes(myId)&&!ok.has(id))}
const safeLink=u=>/^https:\/\//i.test(u||'')||/^http:\/\//i.test(u||'');

/* ---------- lojas, afiliados e publicidade ---------- */
const LOJAS_BASE={
  amazon:{nome:'Amazon',busca:'https://www.amazon.com.br/s?k={q}',dominio:'amazon.com.br'},
  ml:{nome:'Mercado Livre',busca:'https://lista.mercadolivre.com.br/{q-}',dominio:'mercadolivre.com.br'},
  magalu:{nome:'Magalu',busca:'https://www.magazineluiza.com.br/busca/{q}/',dominio:'magazineluiza.com.br'},
  shopee:{nome:'Shopee',busca:'https://shopee.com.br/search?keyword={q}',dominio:'shopee.com.br'},
  americanas:{nome:'Americanas',busca:'https://www.americanas.com.br/busca/{q}',dominio:'americanas.com.br'}
};
// lojas = base + lojas extras cadastradas no Painel (config.lojasAfiliadas: {id:{nome,busca,dominio,modelo}})
function lojasAfil(){const out={};Object.entries(LOJAS_BASE).forEach(([k,v])=>out[k]={...v,...((config.lojasAfiliadas||{})[k]||{})});Object.entries(config.lojasAfiliadas||{}).forEach(([k,v])=>{if(!out[k]&&v.nome&&v.busca)out[k]=v});return out}
function hostOk(host,dom){dom=String(dom||'').toLowerCase().replace(/^www\./,'');return !!dom&&(host===dom||host.endsWith('.'+dom))}
function affiliate(u){
  try{
    const x=new URL(u);const host=x.hostname.toLowerCase().replace(/^www\./,'');
    if(hostOk(host,'amazon.com.br')&&config.amazonTag&&!x.searchParams.get('tag')){x.searchParams.set('tag',config.amazonTag);return x.toString()}
    if(hostOk(host,'magazinevoce.com.br'))return u;
    for(const L of Object.values(lojasAfil())){if(L.modelo&&L.modelo.includes('{url}')&&hostOk(host,L.dominio))return L.modelo.split('{url}').join(encodeURIComponent(u))}
  }catch(e){}
  return u;
}
function buscaUrl(id,q){
  const L=lojasAfil()[id];if(!L||!L.busca)return '';
  if(id==='magalu'&&config.magaluLoja)return `https://www.magazinevoce.com.br/${encodeURIComponent(config.magaluLoja)}/busca/${encodeURIComponent(q)}/`;
  return affiliate(L.busca.split('{q-}').join(encodeURIComponent(q.trim().replace(/\s+/g,'-'))).split('{q}').join(encodeURIComponent(q)));
}
function catDoItem(nome){const n=String(nome||'').toLowerCase();for(const cats of [CAT_DESEJOS,CAT_PRECISA])for(const [c,its] of Object.entries(cats))if(its.some(it=>n.startsWith(String(Array.isArray(it)?it[0]:it).toLowerCase())))return c;return ''}
function shopLinks(q,cat){
  cat=cat||catDoItem(q);const pref=(config.lojaPorCategoria||{})[cat];
  const ordem=[...new Set([pref,'amazon','ml','magalu'].filter(Boolean))].filter(id=>lojasAfil()[id]).slice(0,3);
  return `<div class="shop"><span>Procurar:</span>${ordem.map(id=>`<a href="${esc(buscaUrl(id,q))}" target="_blank" rel="noopener sponsored" data-track="loja:${esc(id)}">${esc(lojasAfil()[id].nome)}</a>`).join('')}</div>`;
}

/* ---------- anúncios segmentados ---------- */
function adElegivel(a,ctx){
  if(!a.ativo||!a.titulo)return false;
  const h=hoje();if(a.inicio&&h<a.inicio)return false;if(a.fim&&h>a.fim)return false;
  const me=profiles[myId]||{};
  if((a.gostos||[]).length&&!(a.gostos||[]).some(g=>(me.gostosTags||[]).includes(g)))return false;
  if((a.cidades||[]).length&&!(a.cidades||[]).some(c=>normCid(c)===normCid(me.cidade)))return false;
  const local=a.local||'todos';
  if(local==='categoria')return ctx.cat&&a.categoria===ctx.cat;
  if(local==='aniversario')return !!ctx.aniv;
  return !ctx.cat;
}
const normCid=c=>String(c||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function adCard(seed,ctx){
  ctx=ctx||{};if(isPlus(myId))return '';
  let ads=(config.anuncios||[]).filter(a=>adElegivel(a,ctx));if(!ads.length)return '';
  const alvo=ads.filter(a=>(a.gostos||[]).length||(a.cidades||[]).length||a.local==='aniversario');if(alvo.length)ads=alvo;
  const d=new Date();const a=ads[(d.getDate()+(seed||0))%ads.length];
  trackView(a.id);
  return `<section class="panel ad"><div class="eyebrow">Oferta de parceiro</div><h3>${esc(a.titulo)}</h3>${a.texto?`<div class="muted">${esc(a.texto)}</div>`:''}${safeLink(a.link)?`<div><a class="btn small" href="${esc(affiliate(a.link))}" target="_blank" rel="noopener sponsored" data-track="ad:${esc(a.id)}">Ver oferta</a></div>`:''}</section>`;
}
function patrocinioCategoria(cat){
  if(isPlus(myId))return '';
  const ad=(config.anuncios||[]).find(a=>adElegivel(a,{cat}));
  const lj=(config.lojas||[]).filter(l=>l.ativo&&l.categoria===cat);
  if(!ad&&!lj.length)return '';
  let h='<div class="spons">';
  if(ad){trackView(ad.id);h+=`<span class="eyebrow">Oferta de parceiro</span> <b>${esc(ad.titulo)}</b>${ad.texto?' · '+esc(ad.texto):''}${safeLink(ad.link)?` · <a href="${esc(affiliate(ad.link))}" target="_blank" rel="noopener sponsored" data-track="ad:${esc(ad.id)}">Ver oferta</a>`:''}`}
  if(lj.length)h+=`${ad?'<br>':''}<span class="eyebrow">Lojas parceiras</span> ${lj.map(l=>`<button class="link" data-act="openLoja" data-id="${esc(l.id)}">${esc(l.nome)}</button>`).join(' · ')}`;
  return h+'</div>';
}
function relatorioAd(a,v,c){
  const per=[a.inicio&&('de '+new Date(a.inicio+'T12:00').toLocaleDateString('pt-BR')),a.fim&&('até '+new Date(a.fim+'T12:00').toLocaleDateString('pt-BR'))].filter(Boolean).join(' ');
  return `Relatório PresenteCerto – ${a.titulo}\n${per?'Período: '+per+'\n':''}Visualizações (pessoas por dia): ${v}\nCliques em "Ver oferta": ${c}\nTaxa de cliques: ${v?(c/v*100).toFixed(1).replace('.',','):'0'}%\nGerado em ${new Date().toLocaleDateString('pt-BR')}`;

/* ---------- datas ---------- */
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
function daysTo(dia,mes,ano,recorrente){
  if(!dia||!mes)return null;const t=today();
  if(!recorrente&&ano){const d=new Date(+ano,+mes-1,+dia);const n=Math.round((d-t)/864e5);return n<0?null:n}
  let d=new Date(t.getFullYear(),+mes-1,+dia);if(d<t)d=new Date(t.getFullYear()+1,+mes-1,+dia);return Math.round((d-t)/864e5);
}
const bdayDays=p=>p?daysTo(p.dia,p.mes,null,true):null;
function pill(n){if(n===null||n===undefined)return '<span class="when">sem data</span>';if(n===0)return '<span class="when today">É hoje!</span>';return `<span class="when ${n<=30?'soon':''}">${n===1?'amanhã':'em '+n+' dias'}</span>`}
function bdayText(p){if(!p||!p.dia||!p.mes)return 'Aniversário não informado';let s=`${+p.dia} de ${MESES[+p.mes-1]}`;if(p.ano&&+p.ano>1900){const y=new Date(Date.now()+bdayDays(p)*864e5).getFullYear();s+=` · vai fazer ${y-(+p.ano)} anos`}return s}
function nthSunday(y,m,n){const d=new Date(y,m,1);const first=(7-d.getDay())%7;return new Date(y,m,1+first+7*(n-1))}
function holidays(){
  const t=today(),out=[];
  for(const y of [t.getFullYear(),t.getFullYear()+1])out.push(['Dia dos Namorados',new Date(y,5,12)],['Dia das Mães',nthSunday(y,4,2)],['Dia dos Pais',nthSunday(y,7,2)],['Dia das Crianças',new Date(y,9,12)],['Natal',new Date(y,11,25)]);
  return out.map(([n,d])=>({n,d,dias:Math.round((d-t)/864e5)})).filter(h=>h.dias>=0).sort((a,b)=>a.dias-b.dias).slice(0,3);
}
function eventsFor(id){
  const p=profiles[id];if(!p)return[];const ev=[];
  const b=bdayDays(p);if(b!==null)ev.push({id,label:'Aniversário',dias:b,txt:bdayText(p)});
  (p.datas||[]).forEach(d=>{const n=daysTo(d.dia,d.mes,d.ano,RECORRENTE[d.tipo]);if(n!==null)ev.push({id,label:d.tipo==='Outra data'&&d.nota?d.nota:d.tipo,dias:n,txt:`${+d.dia} de ${MESES[+d.mes-1]}${d.ano&&!RECORRENTE[d.tipo]?' de '+d.ano:''}`})});
  return ev;
}

const pixTxt=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 .\-]/g,'').toUpperCase().trim();
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(key,name,city,amount){
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const p=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',String(key).trim()))+f('52','0000')+f('53','986')+(amount?f('54',(+amount).toFixed(2)):'')+f('58','BR')+f('59',(pixTxt(name)||'PRESENTECERTO').slice(0,25))+f('60',(pixTxt(city)||'BRASIL').slice(0,15))+f('62',f('05','***'))+'6304';
  return p+crc16(p);
}

async function irPasso(n){
  n=Math.max(0,Math.min(PASSOS.length-1,n));
  if(dirty){fichaStep=n;await saveMine();if(dirty)return}
  else{fichaStep=n;form=null;keep(renderMine)}
  window.scrollTo(0,0);
}
async function saveMine(){
  if(!dirty)return;const b=app.querySelector('#save');if(b){b.disabled=true;b.textContent='Salvando…'}
  const cur=profiles[myId]||{};
  const data={...draft,ano:String(draft.ano||'').replace(/\D/g,'').slice(0,4),aviso:+draft.aviso||15,aprovados:cur.aprovados||[],recusados:cur.recusados||[],parabensOcultos:cur.parabensOcultos||[],usuario:cur.usuario||'',atualizado:new Date().toISOString()};
  delete data.jaTem;
  try{await db.doc('profiles/'+myId).set(data);profiles[myId]=data;draft=null;dirty=false;toast('Ficha salva');keep(render)}
  catch(e){if(b){b.disabled=false;b.textContent='Salvar ficha'}toast(failMsg)}
}

/* ---------- fotos ---------- */
function compress(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=480;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);let q=.75,out=c.toDataURL('image/jpeg',q);while(out.length>120000&&q>.35){q-=.1;out=c.toDataURL('image/jpeg',q)}res(out)};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
document.getElementById('fotoInput').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file||!fotoTarget)return;
  const item=fotoTarget;fotoTarget=null;toast('Enviando foto…');
  try{const img=await compress(file);await db.doc(`fotos/${myId}/itens/${item}`).set({img});fotos[myId]={...(fotos[myId]||{}),[item]:img};if(dirty)toast('Foto salva. Lembre de salvar a ficha.');else toast('Foto salva');keep(render)}
  catch(err){toast('Não foi possível usar esta foto. Tente outra imagem.')}
});

const val=id=>(app.querySelector('#'+id)?.value||'').trim();
const num=s=>{let t=String(s).replace(/[^\d,.]/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/\.\d{3}$/.test(t))t=t.replace(/\./g,'');const n=parseFloat(t);return isFinite(n)&&n>0?Math.round(n*100)/100:0};
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){const el=app.querySelector('#pixCode');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selecione o texto e copie manualmente')}}
async function toggleFollow(id){
  const cur=following(),next=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];
  const was=followsAll[myId];followsAll[myId]={ids:next};keep(render);
  try{await db.doc('follows/'+myId).set({ids:next});const p=profiles[id];toast(next.includes(id)?(p&&p.fechado&&!canSee(id)?'Pedido enviado':`Agora você segue ${nm(id)}`):`Você deixou de seguir ${nm(id)}`)}
  catch(e){followsAll[myId]=was;keep(render);toast(failMsg)}
}
async function decide(id,ok){
  const me=profiles[myId];const ap=(me.aprovados||[]).filter(x=>x!==id),re=(me.recusados||[]).filter(x=>x!==id);
  (ok?ap:re).push(id);
  try{await db.doc('profiles/'+myId).update({aprovados:ap,recusados:re});profiles[myId]={...me,aprovados:ap,recusados:re};if(draft){draft.aprovados=ap;draft.recusados=re}keep(render);toast(ok?`${nm(id)} agora vê sua ficha`:'Pedido recusado')}catch(e){toast(failMsg)}
}

    case 'sMembro': form.membros=form.membros.includes(ds.id)?form.membros.filter(x=>x!==ds.id):[...form.membros,ds.id];keep(render);break;
    case 'editSorteio': {const s=((sorteios[myId]?.lista)||[]).find(x=>x.id===ds.id);if(!s)break;form={type:'editSorteio',id:s.id,membros:[...(s.membros||[])].filter(x=>x!==myId),busca:'',nome:s.nome};keep(render);break}
    case 'saveSorteioMembros': {const membros=form.membros.filter(x=>x!==myId);if(!isPlus(myId)&&membros.length+1>LIMITE_SORTEIO){toast(`No plano grátis, até ${LIMITE_SORTEIO} participantes. Com o Plus, sem limite.`);break}saveSorteios(((sorteios[myId]?.lista)||[]).map(s=>s.id===ds.id&&!s.pares?{...s,membros}:s),'Participantes atualizados');break}
    case 'criarSorteio': {const nome=(form.nome||'').trim();if(!nome){toast('Dê um nome ao amigo secreto');break}if(!isPlus(myId)&&form.membros.length+1>LIMITE_SORTEIO){toast(`No plano grátis, até ${LIMITE_SORTEIO} participantes. Com o Plus, sem limite.`);break}if(form.membros.length<2){toast('Escolha pelo menos mais 2 pessoas');break}
      const lista=[...((sorteios[myId]?.lista)||[]),{id:uid(),nome:nome.slice(0,50),data:form.data||'',valor:(form.valor||'').slice(0,30),membros:form.membros}];saveSorteios(lista,'Amigo secreto criado');break}
    case 'sortear': {const lista=((sorteios[myId]?.lista)||[]).map(s=>{if(s.id!==ds.id)return s;const ids=[myId,...s.membros.filter(x=>x!==myId)];return{...s,pares:enc(sortear(ids))}});saveSorteios(lista,'Sorteio feito. Cada um já pode ver quem tirou.');break}
    case 'delSorteio': saveSorteios(((sorteios[myId]?.lista)||[]).filter(s=>s.id!==ds.id),'Amigo secreto excluído');break;
    case 'preview': if(dirty){toast('Salve primeiro para ver a versão final');break}viewing=myId;render();window.scrollTo(0,0);break;
    case 'save': saveMine();break;
    case 'pick': {const k=ds.key,v=ds.v;draft[k]=draft[k].includes(v)?draft[k].filter(x=>x!==v):[...draft[k],v];
      if(k==='cores')draft.evitarCores=draft.evitarCores.filter(x=>x!==v);if(k==='evitarCores')draft.cores=draft.cores.filter(x=>x!==v);
      if(k==='perfume'&&v==='Não uso perfume'&&draft.perfume.includes(v))draft.perfume=[v];else if(k==='perfume'&&v!=='Não uso perfume')draft.perfume=draft.perfume.filter(x=>x!=='Não uso perfume');
      dirty=true;keep(renderMine);break}
    case 'up': {const l=draft[ds.key],i=+ds.i;if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];dirty=true;keep(renderMine)}break}
    case 'del': {const it=draft[ds.key].splice(+ds.i,1)[0];if(it&&fotoOf(myId,it.id))db.doc(`fotos/${myId}/itens/${it.id}`).delete().catch(()=>{});dirty=true;keep(renderMine);break}
    case 'recebi': {const it=draft[ds.key].splice(+ds.i,1)[0];draft.recebidos=[...(draft.recebidos||[]),{id:it.id,t:it.t,data:new Date().toISOString()}];dirty=true;keep(renderMine);toast('Movido para Presentes recebidos. Lembre de salvar.');break}
    case 'editItem': form={type:'editItem',key:ds.key,id:ds.id};keep(renderMine);setTimeout(()=>app.querySelector('#eT')?.focus(),0);break;
    case 'saveEdit': {const t=val('eT');if(!t){toast('O item precisa de um nome');break}const l=val('eL');if(l&&!safeLink(l)){toast('O link precisa começar com https://');break}
      const it=draft[ds.key][+ds.i];Object.assign(it,{t:t.slice(0,120),preco:val('eP').slice(0,60),grau:val('eG'),obs:val('eO').slice(0,120),link:l.slice(0,500)});
      form=null;dirty=true;keep(renderMine);toast('Item alterado. Lembre de salvar a ficha.');break}
    case 'formThanks': form={type:'thanks',item:ds.item};keep(renderMine);break;
    case 'sendThanks': {const texto=val('tTexto');if(!texto){toast('Escreva uma mensagem');break}
      const r=(draft.recebidos||[]).find(x=>x.id===ds.item);const givers=giversOf(ds.item);
      const cur=(agrad[myId]?.lista)||[];const lista=[...cur,...givers.map(g=>({id:uid(),para:g,item:ds.item,itemNome:r?r.t:'',texto:texto.slice(0,300),data:new Date().toISOString()}))].slice(-200);
      const was=agrad[myId];agrad[myId]={lista};form=null;keep(renderMine);
      db.doc('agradecimentos/'+myId).set({lista}).then(()=>toast('Agradecimento enviado')).catch(()=>{agrad[myId]=was;keep(renderMine);toast(failMsg)});break}
    case 'foto': fotoTarget=ds.item;document.getElementById('fotoInput').click();break;
    case 'delFoto': {const m={...(fotos[myId]||{})};delete m[ds.item];fotos[myId]=m;keep(renderMine);db.doc(`fotos/${myId}/itens/${ds.item}`).delete().then(()=>toast('Foto retirada')).catch(()=>toast(failMsg));break}
    case 'addItem': {const k=ds.key,t=val(k+'T');if(!t){toast('Escreva o item');app.querySelector('#'+k+'T').focus();break}
      const link=val(k+'L');draft[k].push({id:uid(),criado:new Date().toISOString(),t:t.slice(0,120),preco:val(k+'P').slice(0,60),grau:val(k+'G'),link:safeLink(link)?link.slice(0,500):'',obs:val(k+'O').slice(0,120)});
      form=null;dirty=true;keep(renderMine);toast('Adicionado. Lembre de salvar.');break}
    case 'addData': {const tipo=val('dTipo'),dia=val('dDia'),mes=val('dMes'),ano=val('dAno').replace(/\D/g,'').slice(0,4);
      if(!dia||!mes){toast('Escolha o dia e o mês');break}
      if(!RECORRENTE[tipo]&&tipo!=='Outra data'&&!ano){toast('Informe o ano desta data');break}
      draft.datas.push({id:uid(),tipo,dia,mes,ano,nota:tipo==='Outra data'?val('dNota').slice(0,60):''});dirty=true;keep(renderMine);break}
    case 'delData': draft.datas.splice(+ds.i,1);dirty=true;keep(renderMine);break;
    case 'saveCfg': {const la={...(config.lojasAfiliadas||{})};let erro='';Object.keys(LOJAS_BASE).filter(k=>k!=='amazon'&&k!=='magalu').forEach(k=>{const m=val('mod_'+k);if(m&&!m.includes('{url}'))erro=erro||('O modelo de '+LOJAS_BASE[k].nome+' precisa ter {url}');la[k]={...(la[k]||{}),modelo:m.slice(0,400)}});if(erro){toast(erro);break}
      const lpc={};app.querySelectorAll('.catLoja').forEach(el=>{if(el.value)lpc[el.dataset.cat]=el.value});
      saveConfig({...config,amazonTag:val('cfgAmz').replace(/[^\w-]/g,'').slice(0,40),magaluLoja:val('cfgMg').replace(/[^\w-]/g,'').slice(0,60),lojasAfiliadas:la,lojaPorCategoria:lpc},'Afiliados salvos');break}
    case 'addLojaAf': {const nome=val('nlNome'),dom=val('nlDom').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,''),busca=val('nlBusca'),mod=val('nlMod');
      if(!nome||!dom){toast('Preencha o nome e o domínio da loja');break}if(busca&&!busca.includes('{q}')){toast('Na busca, troque a palavra buscada por {q}');break}if(mod&&!mod.includes('{url}')){toast('O modelo precisa ter {url}');break}
      const id=dom.replace(/[^a-z0-9]/g,'').slice(0,30);saveConfig({...config,lojasAfiliadas:{...(config.lojasAfiliadas||{}),[id]:{nome:nome.slice(0,30),dominio:dom,busca:busca.slice(0,300),modelo:mod.slice(0,400)}}},'Loja adicionada');break}
    case 'delLojaAf': {const la={...(config.lojasAfiliadas||{})};delete la[ds.id];const lpc={...(config.lojaPorCategoria||{})};Object.keys(lpc).forEach(c=>{if(lpc[c]===ds.id)delete lpc[c]});saveConfig({...config,lojasAfiliadas:la,lojaPorCategoria:lpc},'Loja removida');break}
    case 'addOferta': {const t=val('ofT');let l=val('ofL').replace(/\s+/g,'');if(!t||!l){toast('Preencha o produto e o link');break}if(!/^https?:\/\//i.test(l))l='https://'+l;
      saveConfig({...config,ofertas:[...(config.ofertas||[]),{id:uid(),titulo:t.slice(0,60),preco:val('ofP').slice(0,30),link:l.slice(0,500),loja:val('ofLoja').slice(0,30)}].slice(0,6)},'Oferta publicada no Mural');break}
    case 'delOferta': saveConfig({...config,ofertas:(config.ofertas||[]).filter((x,i)=>i!==+ds.i)},'Oferta removida');break;
    case 'novoAd': adDraft={gostos:[]};form={type:'novoAd'};keep(render);break;
    case 'adGosto': {adDraft=adDraft||{gostos:[]};adDraft.gostos=adDraft.gostos.includes(ds.v)?adDraft.gostos.filter(x=>x!==ds.v):[...adDraft.gostos,ds.v];const vals={};app.querySelectorAll('input,select').forEach(el=>{if(el.id)vals[el.id]=el.value});keep(render);Object.entries(vals).forEach(([k,v])=>{const el=app.querySelector('#'+k);if(el)el.value=v});break}
    case 'addAd': {const ad=lerAdForm('ad');if(!ad)break;form=null;adDraft=null;saveConfig({...config,anuncios:[...(config.anuncios||[]),{id:uid(),ativo:true,...ad}]},'Anúncio publicado');break}
    case 'editAd': adDraft=null;form={type:'editAd',i:+ds.i};keep(render);break;
    case 'saveAd': {const ad=lerAdForm('ea');if(!ad)break;form=null;adDraft=null;saveConfig({...config,anuncios:(config.anuncios||[]).map((x,i)=>i===+ds.i?{...x,...ad}:x)},'Anúncio atualizado');break}
    case 'novaLoja': form={type:'novaLoja'};keep(render);break;
    case 'editLoja': form={type:'editLoja',i:+ds.i};keep(render);break;
    case 'saveLoja': {const l=lerLoja();if(!l)break;const i=+ds.i;form=null;const lojas=[...(config.lojas||[])];if(i<0)lojas.push({id:uid(),ativo:true,...l});else lojas[i]={...lojas[i],...l};saveConfig({...config,lojas},i<0?'Loja cadastrada':'Loja atualizada');break}
    case 'toggleLoja': saveConfig({...config,lojas:(config.lojas||[]).map((x,i)=>i===+ds.i?{...x,ativo:!x.ativo}:x)},'Loja atualizada');break;
    case 'delLoja': saveConfig({...config,lojas:(config.lojas||[]).filter((x,i)=>i!==+ds.i)},'Loja excluída');break;
    case 'openLoja': viewing='loja:'+ds.id;form=null;render();window.scrollTo(0,0);break;
    case 'encModo': encModo=ds.v;keep(render);break;
    case 'togglePlus': {const ref=db.doc('planos/'+ds.id);const on=isPlus(ds.id);(on?ref.delete():ref.set({plus:true,ate:window.firebase.firestore.Timestamp.fromDate(new Date(Date.now()+365*864e5)),codigo:'admin'})).then(()=>toast(on?'Plus desligado':'Plus ligado por 1 ano')).catch(()=>toast('Não foi possível alterar o plano'));break}
    case 'gerarCodigos': gerarCodigos();break;
    case 'resgatar': resgatarCodigo();break;
    case 'savePlusCfg': {let l=val('plusLink').replace(/\s+/g,'');if(l&&!/^https?:\/\//i.test(l))l='https://'+l;saveConfig({...config,plusLink:l.slice(0,300),plusPreco:val('plusPreco').slice(0,40)},'Dados do Plus salvos');break}
    case 'toggleAd': saveConfig({...config,anuncios:(config.anuncios||[]).map((x,i)=>i===+ds.i?{...x,ativo:!x.ativo}:x)},'Anúncio atualizado');break;
    case 'delAd': saveConfig({...config,anuncios:(config.anuncios||[]).filter((x,i)=>i!==+ds.i)},'Anúncio excluído');break;
  }
});

/* ---------- início ---------- */
async function resolveNames(ids){
  ids=ids.filter(i=>i&&!names[i]&&!isEx(i));if(!user||!ids.length)return;
  for(let k=0;k<ids.length;k+=64){try{const ps=await user.profiles(ids.slice(k,k+64));for(const id of ids)if(ps[id])names[id]={name:ps[id].name||'Alguém',avatar:ps[id].avatarUrl}}catch(e){}}
}
// não redesenhar enquanto a pessoa digita ou edita a ficha
function busy(){const a=document.activeElement;return (a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
function softRender(){updateBadge();if(tab==='perfil'&&!viewing&&dirty)return;if(busy()){pendingRender=true;return}keep(render)}
app.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!busy())softRender()},150));
async function refresh(ids){await resolveNames(ids||[]);tryPendingOpen();softRender()}
async function start(){
  db=await claude.use('db');user=await claude.use('user');
  if(!db){render();return}
  myId=user?await user.id():null;
  if(!myId){db=null;render();return}
  try{isOwner=!!(await user.isOwner())}catch(e){}
  if(!isOwner)db.doc('metricas/'+myId).get().then(s=>{if(s.exists){const d=s.data();met={ads:JSON.parse(JSON.stringify(d.ads||{})),lojas:{...(d.lojas||{})}}}metReady=true}).catch(()=>{});
  else db.collection('metricas').onSnapshot(s=>{const n={};s.docs.forEach(d=>{if(d.exists)n[d.id]=d.data()});allMet=n;softRender()},()=>{});
  try{const m=await user.me();myName=m.name||'';myEmail=m.email||'';names[myId]={name:m.name||'Você',avatar:m.avatarUrl};
    document.getElementById('meChip').innerHTML=`${isOwner?'<button class="admin-btn" id="adminBtn">Painel</button>':''}<button class="avatar-btn" id="meBtn" aria-label="Abrir minha ficha"><img src="${esc(m.avatarUrl)}" alt=""></button>`;
    document.getElementById('adminBtn')?.addEventListener('click',()=>{if(tab==='perfil'&&!viewing&&dirty){toast('Salve sua ficha antes de sair');return}setTab('admin')});
    document.getElementById('meBtn').addEventListener('click',()=>{if(tab==='perfil'&&!viewing)return;if(dirty){toast('Salve sua ficha antes de sair');return}setTab('perfil')})}catch(e){}
  render();
  claude.use('sample').then(s=>{sample=s;if(viewing)softRender()});
  const err=()=>toast('Conexão perdida. Recarregue a página.');
  const coll=(path,setter)=>db.collection(path).onSnapshot(s=>{const n={};s.docs.forEach(d=>{if(d.exists)n[d.id]=d.data()});setter(n);refresh(Object.keys(n))},err);
  coll('profiles',n=>{raw.profiles=n;applyRaw()});
  coll('follows',n=>{raw.follows=n;applyRaw()});
  coll('acoes',n=>{raw.acoes=n;applyRaw()});
  coll('agradecimentos',n=>agrad=n);
  coll('sorteios',n=>{raw.sorteios=n;applyRaw()});
  coll('parabens',n=>{raw.parabens=n;applyRaw()});
  coll('usernames',n=>{usernames=n});
  coll('planos',n=>{planos=n});
  if(isOwner)coll('codigos',n=>{codigos=n});
  db.doc('config/app').onSnapshot(s=>{config=s.exists?s.data():{};applyRaw();softRender()},()=>{});
  db.doc(`data/users/${myId}/grupos`).onSnapshot(s=>{grupos=s.exists&&Array.isArray(s.data().lista)?s.data().lista.map(g=>({...g,membros:[...(g.membros||[])]})):[];softRender()},()=>{});
}
if(window.claude&&claude.use)start();else if(!window.__semConfig)render();
})();
