function busy(){const a=document.activeElement;return (a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}

app.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!busy())softRender()},150));
async function refresh(ids){await resolveNames(ids||[]);tryPendingOpen();softRender()}

  db.doc(`data/users/${myId}/aparencia`).onSnapshot(s=>{aparencia=s.exists?{...s.data()}:{};if(!aparencia.v&&aparencia.cor==='rosa')aparencia.cor='roxo';
    if(tab!=='aparencia')aplicarTema(prefsEfetivas());

  const err=()=>toast('Conexão perdida. Recarregue a página.');
  const coll=(path,setter)=>db.collection(path).onSnapshot(s=>{const n={};s.docs.forEach(d=>{if(d.exists)n[d.id]=d.data()});setter(n);refresh(Object.keys(n))},err);
  coll('profiles',n=>{raw.profiles=n;profilesOk=true;applyRaw();lgManutencao()});
  coll('follows',n=>{raw.follows=n;applyRaw()});
  coll('acoes',n=>{raw.acoes=n;applyRaw()});
  coll('agradecimentos',n=>agrad=n);
  coll('sorteios',n=>{raw.sorteios=n;applyRaw()});
  coll('parabens',n=>{raw.parabens=n;applyRaw()});
  coll('usernames',n=>{usernames=n});
  coll('planos',n=>{planos=n;planosOk=true;if(tab!=='aparencia')aplicarTema(prefsEfetivas());tentarInicio();tentarDestaque()});
  db.doc(`data/users/${myId}/destaques`).onSnapshot(s=>{const d=s.exists?s.data():{};dqVistos={...(d.vistos||{}),...dqVistos};dqInstalou=dqInstalou||!!d.instalou;dqVistosOk=true;tentarDestaque()},()=>{dqVistosOk=true;tentarDestaque()});
  if(isOwner){coll('codigos',n=>{codigos=n});coll('assinaturas',n=>{assinaturas=n});db.collection('feedback').onSnapshot(s=>{const n={};s.docs.forEach(d=>{if(d.exists)n[d.id]=d.data()});feedbacks=n;atualizarSino();if(notifAberto)renderSino();if(tab==='admin')softRender()},()=>{})}
  db.doc(`data/users/${myId}/listasRecebidas`).onSnapshot(s=>{listasRec=s.exists&&s.data().lista&&typeof s.data().lista==='object'?{...s.data().lista}:{};if(tab==='eventos'&&!evAberto)softRender()},()=>{});
  db.collection('empresas').where('dono','==',myId).onSnapshot(sn=>{empMeus={};sn.docs.forEach(d=>{empMeus[d.id]=d.data()});if(tab==='empresa'&&!empAberto)softRender()},()=>{});
  db.collection('eventos').where('dono','==',myId).onSnapshot(sn=>{meusEv={};sn.docs.forEach(d=>{meusEv[d.id]=d.data()});meusEvOk=true;if((tab==='eventos'&&!evAberto)||(tab==='mural'&&!viewing))softRender()},()=>{});
  if(myEmail)db.doc('creditos/'+myEmail.toLowerCase().replace(/\//g,'_')).onSnapshot(sn=>{evCred=sn.exists?sn.data():{};if(tab==='eventos')softRender()},()=>{});
  db.doc('respostas/'+myId).onSnapshot(s=>{minhasRespostas=s.exists&&Array.isArray(s.data().lista)?s.data().lista:[];atualizarSino();if(notifAberto)renderSino();if(tab==='sugestao'&&fbDraft&&!fbDraft.texto)renderSugestao()},()=>{});
  db.doc(`data/users/${myId}/privacidade`).onSnapshot(s=>{cabPriv=s.exists?{...s.data()}:{}},()=>{cabPriv={}});
  db.doc(`data/users/${myId}/mensagens`).onSnapshot(s=>{minhasMsgs=s.exists?{...s.data()}:{}},()=>{});
  db.doc('ofertasauto/shopee').onSnapshot(s=>{const d=s.exists?s.data():{};ofAuto=Array.isArray(d.lista)?d.lista:[];ofAutoEm=d.em&&d.em.toDate?d.em.toDate():d.em?new Date(d.em):null;softRender()},()=>{});
  {const dn=sn=>{const n={};sn.docs.forEach(d=>{n[d.id]=String(d.data().email||'').toLowerCase()});lojaDonos=n;softRender();renderMenu()};
   if(isOwner)db.collection('lojasdono').onSnapshot(dn,()=>{});
   else if(myEmail&&window.firebase&&firebase.auth().currentUser&&firebase.auth().currentUser.emailVerified)db.collection('lojasdono').where('email','==',myEmail.toLowerCase()).onSnapshot(dn,()=>{});}
  db.collection('lojas').onSnapshot(sn=>{const n={};sn.docs.forEach(d=>{n[d.id]=d.data()});lojasDb=n;lojasOk=true;ljMigrar();softRender();renderMenu()},()=>{lojasOk=true;softRender()});
  db.doc('config/app').onSnapshot(s=>{config=s.exists?s.data():{};configOk=true;applyRaw();ljMigrar();softRender();tentarDestaque()},()=>{configOk=true;tentarDestaque()});
  db.doc(`data/users/${myId}/grupos`).onSnapshot(s=>{grupos=s.exists&&Array.isArray(s.data().lista)?s.data().lista.map(g=>({...g,membros:[...(g.membros||[])]})):[];softRender()},()=>{});
}
if(window.claude&&claude.use)start();else if(!window.__semConfig)render();
/* ---------- aviso de nova versão e puxar para atualizar ---------- */
(function(){
  let base=null,avisado=false,ultima=0;
  const hash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h};
  async function versaoNoAr(){const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return hash(await r.text())}
  async function conferir(){
    if(avisado||!navigator.onLine||Date.now()-ultima<60000)return;ultima=Date.now();
    try{const h=await versaoNoAr();if(base===null){base=h;return}if(h!==base)mostrar()}catch(e){}
  }
  function mostrar(){
    avisado=true;const d=document.createElement('div');d.className='nova-versao';d.setAttribute('role','status');
    d.innerHTML='<span>Nova versão do PresenteCerto disponível</span><button class="nv-depois">Depois</button><button class="nv-ok">Atualizar</button>';
    d.querySelector('.nv-ok').onclick=()=>{if(typeof dirty!=='undefined'&&dirty&&!confirm('Sua ficha tem mudanças que ainda não foram salvas. Atualizar mesmo assim?'))return;location.reload()};
    d.querySelector('.nv-depois').onclick=()=>{d.remove();setTimeout(()=>{avisado=false;ultima=0},30*60000)};
    document.body.appendChild(d);
  }
  conferir();
  setInterval(conferir,5*60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')conferir()});
  window.addEventListener('online',conferir);

  // Puxar para atualizar: só no aplicativo instalado na tela inicial (no navegador, o próprio navegador já faz isso)
  const instalado=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(!instalado)return;
  const ind=document.createElement('div');ind.className='ptr';ind.setAttribute('aria-hidden','true');
  ind.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>';
  document.body.appendChild(ind);
  const LIMITE=80;let y0=null,dy=0;
  const bloqueado=t=>!!(t.closest&&t.closest('.pop,.crop-box,.modal,input,textarea,select,[contenteditable]'))||!!document.querySelector('.crop-ov');
  document.addEventListener('touchstart',e=>{if(window.scrollY>0||e.touches.length!==1||bloqueado(e.target)){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  document.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy<=0||window.scrollY>0){ind.style.opacity=0;return}
    const p=Math.min(dy*0.5,LIMITE+20);ind.style.transform=`translateY(${p-50}px)`;ind.style.opacity=Math.min(1,dy/LIMITE);ind.classList.toggle('pronto',dy*0.5>=LIMITE)},{passive:true});
  document.addEventListener('touchend',()=>{if(y0===null)return;y0=null;
    if(dy*0.5>=LIMITE){if(typeof dirty!=='undefined'&&dirty&&!confirm('Sua ficha tem mudanças que ainda não foram salvas. Atualizar mesmo assim?')){ind.style.opacity=0;return}
      ind.classList.remove('pronto');ind.classList.add('girando');ind.style.transform='translateY(16px)';setTimeout(()=>location.reload(),150)}
    else{ind.style.opacity=0;ind.style.transform='translateY(-60px)'}});
})();

})();
